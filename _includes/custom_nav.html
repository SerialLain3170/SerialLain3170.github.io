<nav>
  <ul style="list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px;">
    {% for item in site.data.navigation %}
      <li>
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% if item.subitems %}
          <ul style="list-style: none; padding-left: 15px; margin-top: 5px;">
            {% for subitem in item.subitems %}
              <li><a href="{{ subitem.url | relative_url }}">{{ subitem.title }}</a></li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</nav>
